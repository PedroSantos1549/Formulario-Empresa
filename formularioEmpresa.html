<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Empresa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 5px;
        }

        p.instrucao {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        input {
            width: 100%;
            padding: 6px 8px;
            font-size: 13px;
            border: 1px solid #000000;
            box-sizing: border-box;
        }

        .linha {
            display: flex;
            gap: 10px;
        }

        .linha .campo {
            flex: 1;
        }

        .ajuda, .status {
            font-size: 11px;
            margin-top: 2px;
            display: block;
        }

        .botoes {
            margin-top: 15px;
        }

        button {
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #000000;
            background-color: #ffffff;
        }

        button[type="submit"] {
            background-color: #000000;
            color: #ffffff;
        }

        .mensagem {
            margin-top: 10px;
            padding: 8px;
            font-size: 13px;
            border: 1px solid #000000;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Formulário Empresa</h1>
        <p class="instrucao">Preencha os campos abaixo (* obrigatório)</p>

        <form id="meuFormulario" novalidate>
            <div class="campo">
                <label for="nomeEmpresa">Nome da empresa *</label>
                <input type="text" id="nomeEmpresa" required maxlength="150">
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="cnpj">CNPJ *</label>
                    <input type="text" id="cnpj" required maxlength="18" placeholder="00.000.000/0000-00">
                    <span class="ajuda">Aceita formato tradicional e alfanumérico.[cite: 1]</span>
                    <span id="statusCnpj" class="status"></span>
                </div>

                <div class="campo">
                    <label for="ie">Inscrição Estadual (IE) *</label>
                    <input type="text" id="ie" required maxlength="30">
                </div>
            </div>

            <div class="campo">
                <label for="endereco">Endereço *</label>
                <input type="text" id="endereco" required maxlength="250">
            </div>

            <div class="campo">
                <label for="telefone">Fone de contato *</label>
                <input type="tel" id="telefone" required maxlength="15" placeholder="(00) 00000-0000">
            </div>

            <div class="campo">
                <label for="responsavel">Nome da pessoa física responsável *</label>
                <input type="text" id="responsavel" required maxlength="150">
            </div>

            <div class="botoes">
                <button type="submit">Salvar Empresa</button>
                <button type="reset">Limpar</button>
            </div>

            <div id="mensagem" class="mensagem"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('meuFormulario');
        const campoCnpj = document.getElementById('cnpj');
        const campoTelefone = document.getElementById('telefone');
        const statusCnpj = document.getElementById('statusCnpj');
        const mensagem = document.getElementById('mensagem');
        const CHAVE_DB = 'formulario_empresa_simples';

        function limpaAlfa(v) {
            return v.toUpperCase().replace(/[^A-Z0-9]/g, '');
        }

        function mascaraCnpj(v) {
            const c = limpaAlfa(v).slice(0, 14);
            if (c.length <= 2) return c;
            if (c.length <= 5) return c.slice(0, 2) + '.' + c.slice(2);
            if (c.length <= 8) return c.slice(0, 2) + '.' + c.slice(2, 5) + '.' + c.slice(5);
            if (c.length <= 12) return c.slice(0, 2) + '.' + c.slice(2, 5) + '.' + c.slice(5, 8) + '/' + c.slice(8);
            return c.slice(0, 2) + '.' + c.slice(2, 5) + '.' + c.slice(5, 8) + '/' + c.slice(8, 12) + '-' + c.slice(12);
        }

        function validaCnpj(v) {
            const c = limpaAlfa(v);
            if (c.length !== 14 || /^([0-9])\1{13}$/.test(c)) return false;
            
            const calc = (base, pesos) => {
                let soma = 0;
                for (let i = 0; i < pesos.length; i++) {
                    soma += (base.charCodeAt(i) - 48) * pesos[i];
                }
                const resto = soma % 11;
                return resto < 2 ? 0 : 11 - resto;
            };

            const p1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
            const p2 = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];

            if (calc(c.slice(0, 12), p1) !== Number(c[12])) return false;
            return calc(c.slice(0, 13), p2) === Number(c[13]);
        }

        function mascaraTel(v) {
            let n = v.replace(/\D/g, '').slice(0, 11);
            if (n.length <= 2) return '(' + n;
            if (n.length <= 6) return '(' + n.slice(0, 2) + ') ' + n.slice(2);
            if (n.length <= 10) return '(' + n.slice(0, 2) + ') ' + n.slice(2, 6) + '-' + n.slice(6);
            return '(' + n.slice(0, 2) + ') ' + n.slice(2, 7) + '-' + n.slice(7);
        }

        campoCnpj.addEventListener('input', () => {
            campoCnpj.value = mascaraCnpj(campoCnpj.value);
            const limpo = limpaAlfa(campoCnpj.value);
            if (!limpo) {
                statusCnpj.textContent = '';
            } else if (limpo.length < 14) {
                statusCnpj.textContent = 'Faltam dígitos.';
            } else if (validaCnpj(limpo)) {
                statusCnpj.textContent = 'CNPJ Válido.';
            } else {
                statusCnpj.textContent = 'CNPJ Inválido.';
            }
        });

        campoTelefone.addEventListener('input', () => {
            campoTelefone.value = mascaraTel(campoTelefone.value);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            mensagem.style.display = 'none';

            const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
            const cnpj = campoCnpj.value.trim();
            const ie = document.getElementById('ie').value.trim();
            const endereco = document.getElementById('endereco').value.trim();
            const telefone = campoTelefone.value.trim();
            const responsavel = document.getElementById('responsavel').value.trim();

            if (!validaCnpj(cnpj)) {
                mensagem.textContent = 'Erro: CNPJ inválido.';
                mensagem.style.display = 'block';
                return;
            }

            const nova = { nomeEmpresa, cnpj, ie, endereco, telefone, responsavel };
            
            // Salva no localStorage para a página de gerenciamento ler depois
            let dados = [];
            try {
                dados = JSON.parse(localStorage.getItem(CHAVE_DB) || '[]');
            } catch {
                dados = [];
            }
            
            dados.unshift(nova);
            localStorage.setItem(CHAVE_DB, JSON.stringify(dados));

            form.reset();
            statusCnpj.textContent = '';
            mensagem.textContent = 'Dados salvos com sucesso!';
            mensagem.style.display = 'block';
        });
    </script>
</body>
</html>
